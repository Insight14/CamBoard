# CamBoard Isolated Sign Vocabulary Configuration (50 signs)
model_name: sign_vocab
seed: 42
num_classes: 50
input_dim: 132
d_model: 128
num_heads: 4
num_layers: 2
dropout: 0.1
max_seq_len: 64
abstain_threshold: 0.40

class_names:
  - hello
  - thank_you
  - please
  - sorry
  - yes
  - no
  - help
  - more
  - want
  - eat
  - drink
  - water
  - food
  - home
  - work
  - school
  - book
  - car
  - go
  - come
  - stop
  - good
  - bad
  - love
  - friend
  - family
  - mother
  - father
  - child
  - name
  - what
  - where
  - when
  - who
  - how
  - today
  - tomorrow
  - yesterday
  - morning
  - night
  - hot
  - cold
  - big
  - small
  - again
  - different
  - same
  - time
  - now
  - finish

data:
  wlasl_dir: data/raw/wlasl
  asl_citizen_dir: data/raw/asl_citizen
  val_signer_fraction: 0.15
  test_signer_fraction: 0.15
  augment_train: true
  augment_config:
    time_warp_p: 0.5
    jitter_std: 0.005
    hand_dropout_p: 0.1
    mirror_p: 0.5
  mixup_alpha: 0.2

training:
  optimizer: adamw
  lr: 5.0e-4
  weight_decay: 1.0e-4
  batch_size: 32
  max_epochs: 80
  early_stop_patience: 10
  scheduler: cosine
  monitor: val_acc
  label_smoothing: 0.0

targets:
  top1_accuracy: 0.85
  top5_accuracy: 0.95

export:
  opset: 17
  quantize: true
  quantize_threshold: 0.005

logging:
  checkpoint_dir: checkpoints
  onnx_dir: onnx
  docs_dir: ../docs/models

